name: Update GitHub Stats

on:
  schedule:
    # 每天 UTC 03:00 执行
    - cron: "0 3 * * *"

  # 可以在 GitHub Actions 页面手动执行
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 拉取你的 Profile 仓库
      - name: Checkout
        uses: actions/checkout@v6

      # 生成 GitHub Stats
      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&theme=vue&show_icons=true
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # 生成 Top Languages
      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&hide_border=true&langs_count=6&theme=vue
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # 提交生成的 SVG
      - name: Commit generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/*.svg

          git commit -m "chore: update GitHub stats" || exit 0

          git push
